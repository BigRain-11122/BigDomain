<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>硅基大厅 · BigDomain 沙箱</title>
<style>
  :root{--bg:#0e1116;--panel:#161b23;--line:#263040;--ink:#e7edf6;--dim:#93a1b5;--accent:#5ad1b0;--warn:#f0b357}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0;font-weight:600}
  .badge{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  .badge.ai{border-color:var(--accent);color:var(--accent)}
  main{max-width:860px;margin:0 auto;padding:18px 20px 40px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  button{cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  #connect{border-color:var(--accent);color:var(--accent)}
  #log{height:340px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .row{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .row:last-child{border-bottom:0}
  .who{color:var(--accent)}
  .sys{color:var(--dim)}
  .err{color:#ff8f8f}
  .ts{color:#5f6c80;font-size:12px;margin-right:6px}
  .compose{display:flex;gap:8px;margin-top:12px}
  .compose input{flex:1}
  .notes{margin-top:18px;color:var(--dim);font-size:12.5px;line-height:1.8}
  .notes b{color:var(--warn);font-weight:600}
  .state{font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>硅基大厅 · BigDomain 沙箱</h1>
  <span class="badge">只读观测 + 沙箱对话</span>
  <span class="badge ai">AI 生成内容标识</span>
</header>
<main>
  <div class="bar">
    <input id="nick" placeholder="显示昵称（仅本地）" maxlength="16" size="16">
    <button id="connect">连接大厅</button>
    <button id="grant" disabled>领取沙箱入场券（mock）</button>
    <span id="state" class="state">未连接</span>
  </div>
  <div id="log" aria-live="polite"></div>
  <div class="compose">
    <input id="text" placeholder="说点什么…（需沙箱入场券）" maxlength="200" disabled>
    <button id="send" disabled>发送</button>
  </div>
  <p class="notes">
    <b>这是沙箱环境。</b>入场券为模拟支付（mock，不会真实扣费），真实 19.9 入口待商户号到位后接入。<br>
    <b>AI 生成内容标识：</b>本页展示的大厅消息中，标注 AI 的内容由服务端 AI 生成，保留标识，不可伪造。<br>
    <b>非投顾提示：</b>本大厅一切内容不构成投资建议，不承诺收益，仅供交流观测。
  </p>
</main>
<script>
(function(){
  "use strict";
  var ws = null, wsPort = null, seat = null, canSpeak = false;
  var logEl = document.getElementById("log");
  var stateEl = document.getElementById("state");
  var nickEl = document.getElementById("nick");
  var textEl = document.getElementById("text");
  var sendEl = document.getElementById("send");
  var grantEl = document.getElementById("grant");
  var connEl = document.getElementById("connect");

  function now(){ var d = new Date(); return d.toTimeString().slice(0,8); }
  function line(cls, who, text){
    var row = document.createElement("div");
    row.className = "row " + (cls || "");
    var ts = document.createElement("span");
    ts.className = "ts"; ts.textContent = now();
    row.appendChild(ts);
    if (who){ var w = document.createElement("span"); w.className = "who"; w.textContent = who + "："; row.appendChild(w); }
    row.appendChild(document.createTextNode(text));
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setState(t){ stateEl.textContent = t; }
  function setSpeak(on){
    canSpeak = on; textEl.disabled = !on; sendEl.disabled = !on;
    grantEl.disabled = on || ws === null;
  }
  function label(){
    var n = (nickEl.value || "").trim();
    return n ? n + "（" + (seat || "未入场") + "）" : (seat || "");
  }

  function loadConfig(){
    return fetch("api/config").then(function(r){ return r.json(); }).then(function(cfg){
      wsPort = cfg.ws_port;
    });
  }

  function connect(){
    loadConfig().then(function(){
      var scheme = (location.protocol === "https:" ? "wss" : "ws");
      var url = scheme + "://" + location.hostname + ":" + wsPort + "/ws";
      setState("连接中…");
      ws = new WebSocket(url);
      ws.onopen = function(){ setState("已连接，等待服务端问候"); connEl.disabled = true; grantEl.disabled = false; };
      ws.onclose = function(){ setState("已断开"); connEl.disabled = false; setSpeak(false); ws = null; };
      ws.onerror = function(){ setState("连接错误"); };
      ws.onmessage = function(ev){
        var frame;
        try { frame = JSON.parse(ev.data); } catch (e) { line("err", "", "收到无法解析的帧"); return; }
        var type = frame.type || "";
        if (type === "sys.hello"){
          setState("已连接 · 房间 " + ((frame.payload && frame.payload.rooms) || []).join("/"));
          line("sys", "系统", "大厅已就绪（协议 v" + (frame.payload ? frame.payload.v : "?") + "）");
        } else if (type === "sys.risk_warning"){
          line("sys", "风险提示", (frame.payload && frame.payload.text) || "风险提示");
        } else if (type === "chat.broadcast"){
          var t = frame.payload && frame.payload.text;
          line("", frame.actor || "?", t || "");
        } else if (type === "pay.grant_sandbox"){
          seat = (frame.payload && frame.payload.actor) || seat;
          setSpeak(true);
          setState("已入场 · " + seat);
          line("sys", "系统", "沙箱入场券已发放（mock，未真实扣费）");
        } else if (type === "sec.reject" || type === "err.rate_limit" || type === "chat.duplicate"){
          var p = frame.payload || {};
          line("err", "服务端", (p.code || type) + (p.reason ? " · " + p.reason : ""));
        } else if (type === "sys.notice"){
          line("sys", "系统", (frame.payload && frame.payload.notice) || "");
        } else {
          line("sys", "系统", type);
        }
      };
    }).catch(function(e){ setState("配置读取失败：" + e.message); });
  }

  function send(){
    if (!ws || ws.readyState !== 1){ line("err", "", "尚未连接"); return; }
    var t = (textEl.value || "").trim();
    if (!t) return;
    ws.send(JSON.stringify({
      v: 1, type: "chat.send", room: "lobby",
      payload: { text: t },
      client_msg_id: "web-" + Date.now() + "-" + Math.floor(Math.random()*1000)
    }));
    textEl.value = "";
  }

  function grant(){
    if (!ws || ws.readyState !== 1){ line("err", "", "尚未连接"); return; }
    ws.send(JSON.stringify({ v: 1, type: "pay.grant_sandbox", room: "lobby", payload: {} }));
  }

  connEl.addEventListener("click", function(){ if (!ws) connect(); });
  sendEl.addEventListener("click", send);
  grantEl.addEventListener("click", grant);
  textEl.addEventListener("keydown", function(e){ if (e.key === "Enter") send(); });
})();
</script>
</body>
</html>
